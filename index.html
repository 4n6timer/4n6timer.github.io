<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>4n6 Timer</title>
  </head>
  <body>
    <div class="w-screen h-screen flex flex-col-reverse">
        <div class="flex-none bg-zinc-200 text-black p-4" id="start-controls">
            <div class="flex flex-row gap-4 justify-between items-center flex-wrap">
                <div class="flex flex-row justify-start items-center">
                    <label for="timer-minutes">Timer:</label>
                    <input id="timer-minutes" name="timer-minutes" type="number" placeholder="min" class="ml-2 w-[5rem] text-right bg-white p-1"/>
                    <span class="ml-1">:</span>
                    <input id="timer-seconds" name="timer-seconds" type="number" placeholder="sec" class="ml-1 w-[5rem] text-right bg-white p-1"/>
                </div>
                <div class="flex flex-row justify-start items-center">
                    <label for="grace-seconds" class="text-lg">Grace Period:</label>
                    <input id="grace-seconds" name="grace-seconds" type="number" placeholder="sec" class="ml-2 w-[5rem] text-right bg-white p-1"/>
                </div>
                <div class="flex flex-row justify-start items-center gap-4">
                    <button id="start-button" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 cursor-pointer">Start</button>
                </div>
            </div>
        </div>
        <div class="flex-none text-white text-3xl hidden" id="stop-controls">
            <button id="stop-button" class="bg-red-500 hover:bg-red-700 text-white font-bold p-8 cursor-pointer w-full">Stop</button>
        </div>
        <div class="flex-none text-white text-3xl hidden" id="reset-restart-controls">
            <button id="restart-button" class="bg-green-500 hover:bg-green-700 text-white font-bold p-8 cursor-pointer w-full">Restart</button>
            <button id="reset-button" class="bg-purple-500 hover:bg-purple-700 text-white font-bold p-8 cursor-pointer w-full">Reset</button>
        </div>
        <div class="grow bg-white text-black flex flex-col justify-center items-start p-8 gap-4 text-4xl font-extralight" id="instructions">
            <div>Use the fields below to set the timer and grace period. The grace period can be 0 seconds.</div>
            <div>When ready, click &ldquo;Start&rdquo;.</div>
        </div>
        <div class="grow bg-black text-white flex flex-col justify-center items-center hidden" id="live-display">
            <div class="text-3xl lg:text-8xl font-extralight" id="timer-label">@label</div>
            <span class="text-8xl lg:text-[16rem] font-mono font-bold" id="timer-value">0:00</span>
            <div class="text-3xl lg:text-8xl font-thin mt-12" id="timer-elapsed">0:00 elapsed</div>
        </div>
        <div class="grow bg-black text-white flex flex-col justify-center items-center hidden" id="summary-display">
            <div class="text-3xl lg:text-8xl font-extralight" id="total-label">Total Length:</div>
            <span class="text-8xl lg:text-[12rem] font-mono font-bold" id="total-value">0:00</span>
            <span class="text-3xl lg:text-8xl font-mono" id="total-allowed">0:00</span>
            <div class="text-3xl lg:text-8xl font-extralight mt-8" id="grace-label">Grace Used:</div>
            <span class="text-8xl lg:text-[12rem] font-mono font-bold text-orange-500" id="grace-value">0:00</span>
            <span class="text-3xl lg:text-8xl font-mono text-orange-500" id="grace-allowed">0:00</span>
            <div class="text-3xl lg:text-8xl font-extralight mt-8" id="overage-label">Overage:</div>
            <span class="text-8xl lg:text-[12rem] font-mono font-bold text-red-500" id="overage-value">0:00</span>
        </div>
    </div>
      <script>
  function formatSeconds(totalSeconds) {
    const sign = totalSeconds < 0 ? '-' : '';
    let sec = Math.abs(totalSeconds);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return sign + m.toString() + ':' + s.toString().padStart(2, '0');
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Sections
    const startControls   = document.getElementById('start-controls');
    const stopControls    = document.getElementById('stop-controls');
    const instructions    = document.getElementById('instructions');
    const liveDisplay     = document.getElementById('live-display');
    const summaryDisplay  = document.getElementById('summary-display');
    const resetRestartControls = document.getElementById('reset-restart-controls');

    // Inputs
    const timerMinutesInput = document.getElementById('timer-minutes');
    const timerSecondsInput = document.getElementById('timer-seconds');
    const graceInput        = document.getElementById('grace-seconds');

    // Live display elements
    const timerLabel   = document.getElementById('timer-label');
    const timerValue   = document.getElementById('timer-value');
    const timerElapsed = document.getElementById('timer-elapsed');

    // Summary elements
    const totalValue    = document.getElementById('total-value');
    const totalAllowed  = document.getElementById('total-allowed');
    const graceLabel    = document.getElementById('grace-label');
    const graceValue    = document.getElementById('grace-value');
    const graceAllowed  = document.getElementById('grace-allowed');
    const overageLabel  = document.getElementById('overage-label');
    const overageValue  = document.getElementById('overage-value');

    // Buttons
    const startButton   = document.getElementById('start-button');
    const stopButton    = document.getElementById('stop-button');
    const restartButton = document.getElementById('restart-button');
    const resetButton   = document.getElementById('reset-button');

    // Background helpers for live display
    function setLiveBgDefault() {
      liveDisplay.classList.remove('bg-orange-500', 'bg-red-500');
      if (!liveDisplay.classList.contains('bg-black')) {
        liveDisplay.classList.add('bg-black');
      }
    }
    function setLiveBgGrace() {
      liveDisplay.classList.remove('bg-black', 'bg-red-500');
      if (!liveDisplay.classList.contains('bg-orange-500')) {
        liveDisplay.classList.add('bg-orange-500');
      }
    }
    function setLiveBgOver() {
      liveDisplay.classList.remove('bg-black', 'bg-orange-500');
      if (!liveDisplay.classList.contains('bg-red-500')) {
        liveDisplay.classList.add('bg-red-500');
      }
    }

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const timerParam = parseInt(params.get('timer') || '0', 10);
    const graceParam = parseInt(params.get('grace') || '0', 10);
    const startParam = params.get('start') ? parseInt(params.get('start'), 10) : null;
    const endParam   = params.get('end')   ? parseInt(params.get('end'), 10)   : null;

    // Populate inputs from URL params
    if (timerParam > 0) {
      timerMinutesInput.value = Math.floor(timerParam / 60);
      timerSecondsInput.value = timerParam % 60;
    }
    if (graceParam >= 0) {
      graceInput.value = graceParam;
    }

    function computeTimerSecondsFromInputs() {
      const m = parseInt(timerMinutesInput.value, 10) || 0;
      const s = parseInt(timerSecondsInput.value, 10) || 0;
      return m * 60 + s;
    }

    function currentGraceSecondsFromInputs() {
      const g = parseInt(graceInput.value, 10);
      return isNaN(g) ? 0 : Math.max(0, g);
    }

    // Simple state helpers
    function showIdle() {
      startControls.classList.remove('hidden');
      instructions.classList.remove('hidden');
      stopControls.classList.add('hidden');
      liveDisplay.classList.add('hidden');
      summaryDisplay.classList.add('hidden');
      resetRestartControls.classList.add('hidden');
      setLiveBgDefault();
    }

    function showRunning() {
      startControls.classList.add('hidden');
      instructions.classList.add('hidden');
      stopControls.classList.remove('hidden');
      liveDisplay.classList.remove('hidden');
      summaryDisplay.classList.add('hidden');
      resetRestartControls.classList.add('hidden');
      setLiveBgDefault();
    }

    function showSummary() {
      startControls.classList.add('hidden');
      instructions.classList.add('hidden');
      stopControls.classList.add('hidden');
      liveDisplay.classList.add('hidden');
      summaryDisplay.classList.remove('hidden');
      resetRestartControls.classList.remove('hidden');
    }

    // Start/Stop via URL
    function startTimer() {
      const tSec = computeTimerSecondsFromInputs();
      const gSec = currentGraceSecondsFromInputs();

      if (!tSec || tSec <= 0) {
        alert('Please enter a valid timer (minutes/seconds).');
        return;
      }

      const newParams = new URLSearchParams();
      newParams.set('timer', tSec.toString());
      newParams.set('grace', gSec.toString());
      newParams.set('start', Date.now().toString());
      // no 'end' on start
      window.location.search = newParams.toString();
    }

    function stopTimer() {
      if (!startParam) {
        alert('Timer has not been started yet.');
        return;
      }
      const newParams = new URLSearchParams(window.location.search);
      newParams.set('end', Date.now().toString());
      window.location.search = newParams.toString();
    }

    function resetTimer() {
      const tSec = computeTimerSecondsFromInputs();
      const gSec = currentGraceSecondsFromInputs();
      const newParams = new URLSearchParams();
      if (tSec > 0) newParams.set('timer', tSec.toString());
      newParams.set('grace', gSec.toString());
      // no start / end
      window.location.search = newParams.toString();
    }

    function handleToggle() {
      if (startParam && !endParam) {
        // running -> stop
        stopTimer();
      } else {
        // idle or finished -> start
        startTimer();
      }
    }

    // Button handlers
    startButton.addEventListener('click', startTimer);
    stopButton.addEventListener('click', stopTimer);
    restartButton.addEventListener('click', startTimer);
    resetButton.addEventListener('click', resetTimer);

    // Spacebar: start/stop/restart
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleToggle();
      }
    });

    // Tap/click anywhere that is not a control: start/stop/restart
    document.addEventListener('pointerdown', (e) => {
        if ('pointerType' in e && e.pointerType !== 'touch') return;
      const interactive = e.target.closest('button, input, a, select, textarea, label');
      if (interactive) return;
      handleToggle();
    });

    // Live updating
    let intervalId = null;

    function startLiveUpdates(timerSec, graceSec, startMs) {
      showRunning();
      if (intervalId) clearInterval(intervalId);

      const update = () => {
        const now = Date.now();
        const elapsedSec = Math.max(0, Math.floor((now - startMs) / 1000));
        const remainingAllotted = timerSec - elapsedSec;

        // Label, main timer, and background color
        if (elapsedSec <= timerSec) {
          timerLabel.textContent = 'Remaining:';
          timerValue.textContent = formatSeconds(remainingAllotted);
          // Rounded remaining seconds
            const r = Math.round(remainingAllotted);

            // Blue flash conditions: multiples of 60s, or equal to 30s or 15s
            const flashBlue =
            r % 60 === 0 ||
            r === 30 ||
            r === 15;

            if (flashBlue) {
            // Blue takes priority during countdown only
            liveDisplay.classList.remove('bg-black', 'bg-orange-500', 'bg-red-500');
            liveDisplay.classList.add('bg-blue-500');
            } else {
            // Back to normal countdown color
            liveDisplay.classList.remove('bg-blue-500');
            setLiveBgDefault(); // black
            }
          //setLiveBgDefault(); // black
        } else {
          const overAllotted = elapsedSec - timerSec;
          if (graceSec > 0 && overAllotted <= graceSec) {
            // In grace period
            timerLabel.textContent = 'Grace Period:';
            timerValue.textContent = formatSeconds(overAllotted);
            setLiveBgGrace(); // orange
          } else {
            // Beyond grace or no grace defined
            const overAfterLimit = graceSec > 0
              ? elapsedSec - (timerSec + graceSec)
              : elapsedSec - timerSec;
            timerLabel.textContent = 'Overage:';
            timerValue.textContent = formatSeconds(overAfterLimit);
            setLiveBgOver(); // red
          }
        }

        // Elapsed display
        timerElapsed.textContent = `${formatSeconds(elapsedSec)} elapsed`;
      };

      update();
      intervalId = setInterval(update, 250);
    }

    function showSummaryValues(timerSec, graceSec, startMs, endMs) {
      if (intervalId) clearInterval(intervalId);

      const eventDurationSec = Math.max(
        0,
        Math.round((endMs - startMs) / 1000)
      );

      const graceTotalSec   = Math.max(graceSec, 0);
      const overAllottedSec = Math.max(eventDurationSec - timerSec, 0);
      const graceUsedSec    = Math.min(overAllottedSec, graceTotalSec);
      const overGraceSec    = Math.max(overAllottedSec - graceTotalSec, 0);
      //console.log(eventDurationSec, graceTotalSec, overAllottedSec, graceUsedSec, overGraceSec);

      showSummary();

      // Total
      totalValue.textContent = formatSeconds(eventDurationSec);
      totalAllowed.textContent = formatSeconds(timerSec);

      if (graceUsedSec > 0) {
        graceLabel.classList.remove('hidden');
        graceValue.classList.remove('hidden');
        graceAllowed.classList.remove('hidden');

        graceValue.textContent = formatSeconds(graceUsedSec);
        graceAllowed.textContent = formatSeconds(graceTotalSec);

        if (overGraceSec > 0) {
          overageLabel.textContent = 'Overage:';
          overageValue.textContent = formatSeconds(overGraceSec);
          overageLabel.classList.remove('hidden');
          overageValue.classList.remove('hidden');
        } else {
          overageLabel.classList.add('hidden');
          overageValue.classList.add('hidden');
        }

      } else {
        graceLabel.classList.add('hidden');
        graceValue.classList.add('hidden');
        graceAllowed.classList.add('hidden');

        const overLimitSec = overAllottedSec;
        if (overLimitSec > 0) {
          overageLabel.textContent = 'Overage:';
          overageValue.textContent = formatSeconds(overLimitSec);
          overageLabel.classList.remove('hidden');
          overageValue.classList.remove('hidden');
        } else {
          overageLabel.classList.add('hidden');
          overageValue.classList.add('hidden');
        }
      }
    }

    // Initial state based on URL
    const timerSec = timerParam;
    const graceSec = Math.max(graceParam, 0);

    if (!startParam || !timerSec || timerSec <= 0) {
      // Idle
      showIdle();
    } else if (startParam && !endParam) {
      // Running
      startLiveUpdates(timerSec, graceSec, startParam);
    } else if (startParam && endParam) {
      // Finished
      showSummaryValues(timerSec, graceSec, startParam, endParam);
    }
  });
</script>
  </body>
</html>
